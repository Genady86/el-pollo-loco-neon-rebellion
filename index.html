<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>El Pollo Loco - Neon Rebellion</title>
        <script src="models/keyboard.class.js"></script>
        <script src="models/game-state.class.js"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Spielsteuerung -->
        <div class="game-actions">
            <button id="sound-btn" type="button">🔊 Ton an</button>

            <button id="pause-btn" type="button">⏸ Pause</button>

            <button id="restart-btn" type="button">↻ Neustart</button>
        </div>

        <header class="game-header">
            <div class="game-brand">
                <p class="game-kicker">EL POLLO LOCO</p>
                <h1 class="neon-title">NEON <span>REBELLION</span></h1>
            </div>

            <div class="level-badge">
                <small>LEVEL 01</small>
                <strong>MEXIKO</strong>
            </div>
        </header>

        <!-- =====================================
     PREMIUM HUD - LEBEN UND MUENZEN
===================================== -->

        <section class="game-hud">
            <!-- Lebensanzeige -->
            <div class="hud-lives">
                <span class="hud-label">PICO · LEBEN</span>

                <div class="hearts" aria-label="3 Leben">
                    <span>♥</span>
                    <span>♥</span>
                    <span>♥</span>
                </div>
            </div>

            <!-- Muenzanzeige -->
            <div class="hud-coins">
                <span class="hud-label">MÜNZEN</span>

                <div class="coin-counter">
                    <span>🪙</span>
                    <strong id="coin-count">0 / 5</strong>
                </div>
            </div>
        </section>

        <canvas id="canvas" width="720" height="480"></canvas>

        <!-- Steuerung unterhalb der Spielbox -->
        <nav class="game-controls" aria-label="Spielsteuerung">
            <div class="control-hint">
                <kbd>A</kbd>
                <kbd>←</kbd>
                <span>Links</span>
            </div>

            <div class="control-hint">
                <kbd>D</kbd>
                <kbd>→</kbd>
                <span>Rechts</span>
            </div>

            <div class="control-hint">
                <kbd>LEERTASTE</kbd>
                <span>Springen</span>
            </div>
        </nav>

        <script src="models/movable-object.class.js"></script>
        <script src="models/cloud.class.js"></script>
        <script src="models/background-object.class.js"></script>
        <script src="models/character.class.js"></script>
        <script src="models/chicken.class.js"></script>
        <script src="models/coin.class.js"></script>
        <script src="models/level.class.js"></script>
        <script src="levels/level1.js"></script>
        <script src="models/world.class.js"></script>
        <script src="script.js"></script>
    </body>
</html>
