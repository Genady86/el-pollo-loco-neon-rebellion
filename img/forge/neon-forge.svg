<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#f3bf79"/>
      <stop offset="1" stop-color="#c8783d"/>
    </linearGradient>
    <linearGradient id="roof" x2="0" y2="1">
      <stop stop-color="#ea8548"/>
      <stop offset="1" stop-color="#89371f"/>
    </linearGradient>
    <radialGradient id="fire">
      <stop stop-color="#fff9c2"/>
      <stop offset=".45" stop-color="#ffc443"/>
      <stop offset="1" stop-color="#e7471d"/>
    </radialGradient>
  </defs>

  <!-- Natuerlicher Bodenschatten -->
  <ellipse cx="120" cy="173" rx="108" ry="6"
           fill="#59291c" opacity=".3"/>

  <!-- Schornstein -->
  <rect x="175" y="8" width="23" height="50"
        rx="3" fill="#ab7051" stroke="#71402d"
        stroke-width="3"/>
  <path d="M172 11 H201 V18 H172Z" fill="#d5a075"/>
  <path d="M184 7 Q170 -5 184 -17"
        stroke="#d9c3b4" stroke-width="6"
        opacity=".4" fill="none"/>

  <!-- Lehmgebaeude -->
  <rect x="51" y="48" width="167" height="121"
        rx="7" fill="url(#wall)"
        stroke="#8b4b2f" stroke-width="4"/>

  <!-- Steinmauer am unteren Rand -->
  <rect x="51" y="151" width="167" height="18"
        fill="#98705b"/>
  <path d="M55 159 H214 M77 151 V159
           M120 159 V169 M167 151 V159"
        stroke="#654538" stroke-width="2"/>

  <!-- Traditionelles Terrakotta-Dach -->
  <path d="M31 65 L119 21 L229 65 L220 76
           L118 38 L40 78 Z"
        fill="url(#roof)" stroke="#74331d"
        stroke-width="4"/>

  <!-- Einzelne Dachziegel -->
  <g fill="none" stroke="#f4ac62"
     stroke-width="3" opacity=".8">
    <path d="M54 64 L120 31 L205 66"/>
    <path d="M73 58 L120 37 L188 67"/>
  </g>
  <g fill="none" stroke="#80371f"
     stroke-width="2">
    <path d="M69 56 L77 70 M99 42 L110 64
             M137 43 L139 54 M167 52 L177 64"/>
  </g>

  <!-- Balken der offenen Werkstatt -->
  <rect x="67" y="72" width="9" height="90"
        fill="#643b28"/>
  <rect x="155" y="72" width="9" height="90"
        fill="#643b28"/>
  <rect x="66" y="76" width="98" height="9"
        fill="#815030"/>

  <!-- Dunkler Ofen -->
  <path d="M81 148 V112 Q81 91 107 91
           Q133 91 133 112 V148 Z"
        fill="#6b4433" stroke="#442b23"
        stroke-width="4"/>
  <path d="M91 146 V115 Q91 102 107 102
           Q123 102 123 115 V146 Z"
        fill="#271b20"/>

  <!-- Schmiedefeuer -->
  <path d="M96 143 Q84 127 100 111
           Q101 126 110 116 Q127 133 117 143Z"
        fill="url(#fire)"/>
  <path d="M103 143 Q97 134 107 123
           Q117 135 112 143Z"
        fill="#fff3ad"/>

  <!-- Funken -->
  <g fill="#ffe38c">
    <circle cx="99" cy="104" r="2"/>
    <circle cx="120" cy="97" r="1.8"/>
    <circle cx="113" cy="89" r="1.5"/>
  </g>

  <!-- Amboss und Holzsockel -->
  <rect x="175" y="146" width="29" height="22"
        rx="2" fill="#82502d"/>
  <path d="M166 132 H210 L221 122 H195
           L189 116 H180 L177 126 H166 Z"
        fill="#8299ab" stroke="#405569"
        stroke-width="3"/>
  <rect x="183" y="132" width="16" height="16"
        fill="#607788"/>
  <path d="M174 125 H213" stroke="#cbe6ed"
        stroke-width="2"/>

  <!-- Werkzeug an der Wand -->
  <path d="M181 83 V113 M194 82 V112"
        stroke="#61402e" stroke-width="3"/>
  <path d="M175 82 H187 V89 H175Z"
        fill="#81909a"/>
  <path d="M188 81 H199 V91 H195 L191 87Z"
        fill="#98a8ad"/>

  <!-- Mexikanische Buntglasfenster -->
  <rect x="177" y="99" width="23" height="14"
        rx="3" fill="#3d4151"
        stroke="#8e5432" stroke-width="3"/>
  <path d="M188 100 V112"
        stroke="#d8a65c" stroke-width="2"/>

  <!-- Dezente Neon-Rebellion-Akzente -->
  <path d="M66 82 H156" stroke="#39e5d4"
        stroke-width="2" opacity=".75"/>
  <path d="M73 167 H156" stroke="#ed65b6"
        stroke-width="2" opacity=".55"/>

  <!-- Holzschild -->
  <rect x="80" y="54" width="76" height="23"
        rx="4" fill="#79482f"
        stroke="#e6af6e" stroke-width="2"/>
  <text x="118" y="69" text-anchor="middle"
        font-family="Georgia,serif"
        font-weight="bold" font-size="11"
        fill="#ffe0a0">LA FORJA</text>
</svg>
